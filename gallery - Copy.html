<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Showroom | AU Cabinet</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --card: #161616; }
        body { background-color: var(--dark); color: #d1d1d1; font-family: 'Montserrat', sans-serif; }
        h1, h2, .navbar-brand { font-family: 'Playfair Display', serif; color: #fff; }
        .navbar { background: #000 !important; border-bottom: 1px solid #222; }
        .nav-link { color: #fff !important; text-transform: uppercase; letter-spacing: 2px; font-size: 12px; }
        .gallery-item { background: var(--card); border: 1px solid #222; overflow: hidden; margin-bottom: 30px; }
        .gallery-item img { width: 100%; height: 300px; object-fit: cover; opacity: 0.8; transition: 0.5s; }
        .gallery-item:hover img { opacity: 1; transform: scale(1.05); }
        .btn-gold { background: var(--gold); color: #000; border-radius: 0; font-weight: 600; padding: 12px 30px; border: none; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top p-4">
        <div class="container">
            <a href="index.html" class="navbar-brand"><h2>AU <span style="color:var(--gold)">CABINET</span></h2></a>
            <div class="navbar-nav ms-auto">
                <a href="index.html" class="nav-link px-3">Home</a>
                <a href="gallery.html" class="nav-link px-3 active">Our Work</a>
                <a href="contact.html" class="nav-link px-3">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5 text-center">
        <h1 class="display-3 mb-4">Our Showroom</h1>
        <p class="mb-5">A collection of our finest custom cabinetry and kitchen renovations.</p>
        
        <div class="row">
            <!-- Project 1 -->
            <div class="col-md-4">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1556912177-85dec81f9c29?q=80&w=600" alt="Kitchen 1">
                    <div class="p-3"><h5>Modern Charcoal Kitchen</h5></div>
                </div>
            </div>
            <!-- Project 2 -->
            <div class="col-md-4">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1600585152220-90363fe7e115?q=80&w=600" alt="Kitchen 2">
                    <div class="p-3"><h5>Minimalist Island Design</h5></div>
                </div>
            </div>
            <!-- Project 3 -->
            <div class="col-md-4">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1595428774223-ef52624120d2?q=80&w=600" alt="Wardrobe">
                    <div class="p-3"><h5>Luxury Walk-in Robe</h5></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
