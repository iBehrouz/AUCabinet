<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>SHOWROOM</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <link rel="icon" href="favicon2.ico" type="image/x-icon">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-bg: #0a0a0a;
            --card-bg: #111111;
            --text-light: #f4f4f4;
            --text-muted: #666666;
        }

        body { 
            background-color: var(--dark-bg); 
            color: var(--text-light); 
            font-family: 'Montserrat', sans-serif; 
            letter-spacing: 0.5px;
        }

        h1, h2, h3, h4 { 
            font-family: 'Playfair Display', serif; 
            color: #fff; 
        }

        /* Navbar */
        .navbar-showroom { 
            background: #000 !important; 
            border-bottom: 1px solid #111;
            padding: 15px 0;
        }
        
        .nav-link { 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 10px; 
            font-weight: 300;
            color: #777 !important;
        }
        
        .nav-link:hover, .nav-link.active { 
            color: var(--primary-gold) !important; 
        }

        /* Gallery Tiles */
        .gallery-item { 
            background: var(--card-bg); 
            border: 1px solid #1a1a1a; 
            transition: 0.6s cubic-bezier(0.165, 0.84, 0.44, 1); 
            overflow: hidden; 
            height: 100%;
            text-decoration: none;
        }
        
        .gallery-item:hover { 
            border-color: #333; 
            transform: translateY(-5px); 
        }
        
        .gallery-img { 
            overflow: hidden; 
            height: 280px; 
        }
        
        .gallery-img img { 
            object-fit: cover; 
            width: 100%; 
            height: 100%; 
            transition: 1.2s; 
            opacity: 0.6; 
        }
        
        .gallery-item:hover .gallery-img img { 
            opacity: 1; 
            transform: scale(1.05);
        }

        .category-title {
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            margin: 0;
            font-weight: 400;
        }

        .divider {
            width: 30px;
            height: 1px;
            background: var(--primary-gold);
            margin: 20px auto;
        }

        /* Minimalist Neutral Footer */
        .footer-showroom { 
            background: #000 !important; 
            border-top: 1px solid #111; 
            padding: 100px 0 60px; 
        }

        .copyright-text {
            font-size: 10px;
            color: #444;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .navbar-toggler { border: none; }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-showroom sticky-top">
        <div class="container-fluid px-4 px-lg-5">
            <a href="gallery.html" class="navbar-brand">
                <img src="img/showroomlogo.png" alt="Showroom" style="height: 40px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars text-white"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto py-4 py-lg-0">
                    <a href="showroom_kitchen.html" class="nav-item nav-link">Kitchen</a>
                    <a href="showroom_pantry.html" class="nav-item nav-link">Pantry</a>
                    <a href="showroom_laundry.html" class="nav-item nav-link">Laundry</a>
                    <a href="showroom_tv.html" class="nav-item nav-link">TV Unit</a>
                    <a href="showroom_bath.html" class="nav-item nav-link">Bathroom</a>
                    <a href="showroom_robe.html" class="nav-item nav-link">Wardrobes</a>
                    <a href="showroom_shop.html" class="nav-item nav-link">Workspace</a>
                    <a href="showroom_other.html" class="nav-item nav-link">Other</a>
                    <a href="showroom_colors.html" class="nav-item nav-link">Colors</a>
                    <a href="showroom_colors.html" class="nav-item nav-link">Materials</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="container-fluid py-5">
        <div class="container text-center py-5">
            <h1 class="display-6 mb-3" style="letter-spacing: 5px;">SHOWROOM</h1>
            <p class="small text-uppercase text-muted" style="letter-spacing: 3px;">Precision Manufacturing & Design Excellence</p>
            <div class="divider"></div>
        </div>
    </div>

    <!-- 10 Categories Collection Grid -->

        <div class="container">
            <div class="row g-4">
                <!-- 1 -->
                <div class="col-lg-4 col-md-6">
                    <a href="showroom_kitchen.html" class="gallery-item d-block">

                    </a>
                </div>
                <!-- 2 -->

                    </a>
                </div>
                <!-- 3 -->
                <div class="col-lg-4 col-md-6">
                    <a href="showroom_laundry.html" class="gallery-item d-block">

                </div>
                <!-- 4 -->

                        <div class="p-4 text-center"><h4 class="category-title">TV Unit</h4></div>
                    </a>
                </div>
                <!-- 5 -->
                <div class="col-lg-4 col-md-6">

                        <div class="gallery-img"><img src="img/showroom_bath.jpg" alt="Bathroom"></div>
                        <div class="p-4 text-center"><h4 class="category-title">Bathroom</h4></div>
                    </a>
                </div>
                <!-- 6 -->
                <div class="col-lg-4 col-md-6">
                    <a href="showroom_robe.html" class="gallery-item d-block">
                        <div class="gallery-img"><img src="img/showroom_robe.jpg" alt="Wardrobes"></div>
                        <div class="p-4 text-center"><h4 class="category-title">Wardrobes</h4></div>
                    </a>
                </div>
                <!-- 7 -->
                <div class="col-lg-4 col-md-6">
                    <a href="showroom_shop.html" class="gallery-item d-block">

                        <div class="p-4 text-center"><h4 class="category-title">Workspace</h4></div>
                    </a>

                <!-- 8 -->

                    </a>
                </div>
                <!-- 9 -->
                <div class="col-lg-4 col-md-6">
                    <a href="showroom_colors.html" class="gallery-item d-block">
                        <div class="gallery-img"><img src="img/showroom_colors.jpg" alt="Colors"></div>
                        <div class="p-4 text-center"><h4 class="category-title">Colors</h4></div>
                    </a>
                </div>
                <!-- 10 -->

                </div>
            </div>
        </div>

    <!-- Pure Minimalist Footer -->
    <footer class="footer-showroom text-center">
        <div class="container">
            <p class="copyright-text">
                PROJECT GALLERY &copy; <span id="year"></span>
            </p>
        </div>
    </footer>

    <script>
        // Keeping copyright alive today
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
