<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WORKSPACE | Showroom</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon2.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet"> 
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; --card: #111; }
        body { background-color: var(--dark); color: #f4f4f4; font-family: 'Montserrat', sans-serif; letter-spacing: 0.5px; }
        h1, h4 { font-family: 'Playfair Display', serif; color: #fff; }
        .navbar-showroom { background: #000 !important; border-bottom: 1px solid #111; padding: 10px 0; }
        .nav-link { text-transform: uppercase; letter-spacing: 1px; font-size: 10px; color: #777 !important; padding: 5px 8px !important; }
        .nav-link:hover, .nav-link.active { color: var(--gold) !important; }
        .style-card { background: var(--card); border: 1px solid #1a1a1a; padding: 15px; transition: 0.3s; cursor: pointer; text-align: center; }
        .style-card.active { border-color: var(--gold); }
        .style-card i { color: var(--gold); font-size: 1.2rem; margin-bottom: 10px; display: block; }
        .style-card h4 { font-size: 0.75rem; letter-spacing: 1px; margin: 0; text-transform: uppercase; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .gallery-grid a { display: block; overflow: hidden; border: 1px solid #1a1a1a; }
        .gallery-grid img { width: 100%; height: 280px; object-fit: cover; transition: 0.5s; opacity: 0.7; }
        .gallery-grid a:hover img { opacity: 1; transform: scale(1.05); }
        .footer-showroom { background: #000 !important; border-top: 1px solid #111; padding: 60px 0; }
        .divider { width: 30px; height: 1px; background: var(--gold); margin: 15px auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-showroom sticky-top">
        <div class="container-fluid px-4">
            <a href="gallery.html" class="navbar-brand"><img src="img/showroomlogo.png" style="height: 35px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navNav"><span class="fa fa-bars text-white"></span></button>
            <div class="collapse navbar-collapse" id="navNav">
                <div class="navbar-nav ms-auto">
                    <a href="showroom_kitchen.html" class="nav-item nav-link">Kitchen</a>
                    <a href="showroom_pantry.html" class="nav-item nav-link">Pantry</a>
                    <a href="showroom_laundry.html" class="nav-item nav-link">Laundry</a>
                    <a href="showroom_tv.html" class="nav-item nav-link">TV Unit</a>
                    <a href="showroom_bath.html" class="nav-item nav-link">Bathroom</a>
                    <a href="showroom_robe.html" class="nav-item nav-link">Wardrobes</a>
                    <a href="showroom_shop.html" class="nav-item nav-link active">Workspace</a>
                    <a href="showroom_other.html" class="nav-item nav-link">Other</a>
                    <a href="showroom_colors.html" class="nav-item nav-link">Colors</a>
                    <a href="showroom_colors.html" class="nav-item nav-link">Materials</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="container text-center py-5">
        <h1 class="display-6">WORKSPACE</h1>
        <div class="divider"></div>
        <p class="small text-uppercase text-muted">Functional Studio & Shop Joinery</p>
    </div>

    <div class="container pb-4">
        <div class="row g-2 justify-content-center">
            <div class="col-4 col-lg-2"><div class="style-card active" onclick="applyFilter('all', this)"><i class="fa fa-th"></i><h4>All</h4></div></div>
            <div class="col-4 col-lg-2"><div class="style-card" onclick="applyFilter('desk', this)"><i class="fa fa-laptop"></i><h4>Desk</h4></div></div>
            <div class="col-4 col-lg-2"><div class="style-card" onclick="applyFilter('office', this)"><i class="fa fa-building"></i><h4>Office</h4></div></div>
            <div class="col-4 col-lg-2"><div class="style-card" onclick="applyFilter('shop', this)"><i class="fa fa-store"></i><h4>Shop</h4></div></div>
        </div>
    </div>

    <div class="container py-5"><div class="gallery-grid" id="gallery"></div></div>

    <footer class="footer-showroom text-center">
        <p style="font-size: 10px; color: #444; letter-spacing: 4px; text-transform: uppercase;">
            PROJECT GALLERY &copy; <span id="year"></span>
        </p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let allPhotos = [];
        async function init() {
            const res = await fetch('https://api.github.com/repos/ibehrouz/ibehrouz.github.io/contents/photos/desk');
            allPhotos = await res.json();
            render('all');
        }
        function render(f) {
            const div = document.getElementById('gallery'); div.innerHTML = '';
            allPhotos.forEach(p => {
                if (f === 'all' || p.name.toLowerCase().includes(f)) {
                    if (p.name.match(/\.(jpg|jpeg|png)$/i)) {
                        const a = document.createElement('a');
                        a.href = p.download_url; a.setAttribute('data-lightbox', 'desk');
                        a.innerHTML = `<img src="${p.download_url}" loading="lazy">`;
                        div.appendChild(a);
                    }
                }
            });
        }
        function applyFilter(c, e) {
            document.querySelectorAll('.style-card').forEach(x => x.classList.remove('active'));
            e.classList.add('active'); render(c);
        }
        init();
    </script>
</body>
</html>
