<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Kitchen Showroom | AU Cabinet</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon2.ico" type="image/x-icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        :root {
            --gold: #c5a059;
            --dark: #0a0a0a;
            --card-bg: #161616;
        }

        body { background-color: var(--dark); color: #e0e0e0; font-family: 'Montserrat', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Playfair Display', serif; color: #fff; margin-bottom: 0.5rem; }
        
        /* Compact Typography */
        h1 { font-size: 2rem; }
        h4 { font-size: 1rem; letter-spacing: 1px; }

        @media (max-width: 768px) {
            h1 { font-size: 1.5rem; }
            .container-fluid.py-5 { padding-top: 2rem !important; }
        }

        /* Interactive Style Cards */
        .style-card { 
            background: var(--card-bg); 
            border: 1px solid #222; 
            padding: 20px; 
            transition: 0.3s; 
            cursor: pointer;
            height: 100%;
            text-align: center;
        }
        .style-card.active { border-color: var(--gold); box-shadow: 0 0 15px rgba(197, 160, 89, 0.3); }
        .style-card:hover { border-color: var(--gold); }
        .style-card i { color: var(--gold); font-size: 1.8rem; margin-bottom: 15px; display: block; }
        .style-card p { font-size: 0.75rem; color: #a0a0a0; line-height: 1.4; margin: 0; }

        /* Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            transition: 0.5s;
        }
        .gallery-grid a { display: block; overflow: hidden; border: 1px solid #222; animation: fadeIn 0.5s ease; }
        .gallery-grid img { width: 100%; height: 250px; object-fit: cover; display: block; transition: 0.5s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-gold { background: var(--gold); color: #000; font-weight: 600; padding: 10px 25px; border: none; text-transform: uppercase; font-size: 0.8rem; }
        .section-line { width: 40px; height: 1px; background: var(--gold); margin: 15px auto; }

        /* Filter Label */
        #filter-label { color: var(--gold); font-size: 0.7rem; text-uppercase; letter-spacing: 2px; display: block; margin-bottom: 20px; }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top p-0 px-4 px-lg-5">
        <a href="gallery.html" class="navbar-brand py-2">
            <img src="img/showroomlogo.png" alt="Showroom Logo" style="height: 40px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-3 py-lg-0">
                <a href="index.html" class="nav-item nav-link">Home</a>
                <a href="gallery.html" class="nav-item nav-link">Showroom</a>
                <a href="showroom_kitchen.html" class="nav-item nav-link active">Kitchen</a>
            </div>
            <a href="mailto:Info@AUCabinet.au?subject=Quote" class="btn btn-gold d-none d-lg-block ms-3">Get Quote</a>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="container-fluid py-4 py-lg-5">
        <div class="container text-center">
            <h1>Kitchen Collections</h1>
            <div class="section-line"></div>
            <p style="color: var(--gold); letter-spacing: 3px; text-uppercase; font-size: 0.6rem; margin: 0;">Select a style to filter</p>
        </div>
    </div>

    <!-- Clickable Styles Section -->
    <div class="container-xxl py-4">
        <div class="container">
            <div class="row g-2">
                <div class="col-6 col-lg-2">
                    <div class="style-card active" onclick="applyFilter('all', this)">
                        <i class="fa fa-th"></i>
                        <h4>Show All</h4>
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <div class="style-card" onclick="applyFilter('shaker', this)">
                        <i class="fa fa-utensils"></i>
                        <h4>Shaker</h4>
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <div class="style-card" onclick="applyFilter('modern', this)">
                        <i class="fa fa-minus"></i>
                        <h4>Modern</h4>
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <div class="style-card" onclick="applyFilter('tone', this)">
                        <i class="fa fa-palette"></i>
                        <h4>Two-Tone</h4>
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <div class="style-card" onclick="applyFilter('glass', this)">
                        <i class="fa fa-th-large"></i>
                        <h4>Glass</h4>
                    </div>
                </div>
                <div class="col-6 col-lg-2">
                    <div class="style-card" onclick="applyFilter('shelf', this)">
                        <i class="fa fa-columns"></i>
                        <h4>Open</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Section -->
    <div class="container-xxl py-5">
        <div class="container text-center">
            <span id="filter-label">Displaying: All Projects</span>
            <div class="gallery-grid" id="gallery">
                <!-- Automated Loader -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer mt-5 py-5 text-center">
        <div class="container">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-4">
                    <a href="tel:+61412270000" class="text-white small">+61 412 270 000</a>
                </div>
                <div class="col-lg-4">
                    <a href="mailto:Info@AUCabinet.au" class="text-white small">Info@AUCabinet.au</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>

    <script>
        let allPhotos = []; // Store all data once fetched

        async function initGallery() {
            try {
                const response = await fetch('https://api.github.com/repos/ibehrouz/ibehrouz.github.io/contents/photos/kitchen');
                allPhotos = await response.json();
                renderGallery('all');
            } catch (e) { console.error("Load failed", e); }
        }

        function renderGallery(filter) {
            const galleryDiv = document.getElementById('gallery');
            const label = document.getElementById('filter-label');
            galleryDiv.innerHTML = '';
            
            label.innerText = filter === 'all' ? 'Displaying: All Projects' : `Displaying: ${filter.toUpperCase()} Designs`;

            allPhotos.forEach(file => {
                const fileName = file.name.toLowerCase();
                // Match filter OR show all
                if (filter === 'all' || fileName.includes(filter)) {
                    if (file.type === 'file' && fileName.match(/\.(jpg|jpeg|png|gif)$/i)) {
                        const a = document.createElement('a');
                        a.href = file.download_url;
                        a.setAttribute('data-lightbox', filter); // Only swipe through filtered set
                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        a.appendChild(img);
                        galleryDiv.appendChild(a);
                    }
                }
            });
        }

        function applyFilter(category, element) {
            // UI Toggle
            document.querySelectorAll('.style-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            
            // Logic
            renderGallery(category);
            
            // Smooth Scroll
            window.scrollTo({ top: document.getElementById('gallery').offsetTop - 100, behavior: 'smooth' });
        }

        initGallery();
    </script>
</body>
</html>
