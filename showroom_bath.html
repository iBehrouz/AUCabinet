<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Bathroom Showroom | AU Cabinet</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon2.ico" type="image/x-icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"> 

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">

    <style>
        :root {
            --primary-gold: #c5a059;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-light: #e0e0e0;
        }

        body { background-color: var(--dark-bg); color: var(--text-light); font-family: 'Montserrat', sans-serif; }
        h1, h2, h3, h4, .navbar-brand { font-family: 'Playfair Display', serif; color: #fff; }
        
        .accent { color: var(--primary-gold); }
        a { text-decoration: none; transition: 0.3s; }
        
        /* Navbar */
        .navbar-dark { background: #000 !important; border-bottom: 1px solid #222; }
        .nav-link { text-transform: uppercase; letter-spacing: 1px; font-size: 11px; }
        
        /* Filter Cards */
        .style-card { 
            background: var(--card-bg); 
            border: 1px solid #222; 
            padding: 15px; 
            transition: 0.3s; 
            cursor: pointer;
            text-align: center;
            height: 100%;
        }
        .style-card.active { border-color: var(--primary-gold); box-shadow: 0 0 10px rgba(197, 160, 89, 0.2); }
        .style-card i { color: var(--primary-gold); font-size: 1.2rem; margin-bottom: 10px; display: block; }
        .style-card h4 { font-size: 0.75rem; letter-spacing: 1px; margin: 0; text-transform: uppercase; }

        /* Gallery */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .gallery-grid a { display: block; overflow: hidden; border: 1px solid #222; animation: fadeIn 0.5s ease; }
        .gallery-grid img { width: 100%; height: 280px; object-fit: cover; display: block; transition: 0.5s; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-gold { background: var(--primary-gold); color: #000; font-weight: 600; padding: 10px 25px; border: none; text-transform: uppercase; font-size: 0.8rem; }
        .section-line { width: 40px; height: 1px; background: var(--primary-gold); margin: 15px auto; }

        /* Footer */
        .footer { background: #000 !important; border-top: 1px solid #222; padding: 80px 0 40px; }
        .contact-link-tel { color: #fff; font-size: 1.3rem; font-weight: 400; }
        .contact-link-email { color: #fff; font-size: 0.95rem; font-weight: 400; }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top p-0 px-4 px-lg-5">
        <a href="index.html" class="navbar-brand py-2">
            <img src="img/showroomlogo.png" alt="Showroom Logo" style="height: 40px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
            <div class="navbar-nav ms-auto py-4 py-lg-0">
                <a href="index.html" class="nav-item nav-link">Home</a>
                <a href="gallery.html" class="nav-item nav-link active">Showroom</a>
            </div>
            <a href="mailto:Info@AUCabinet.au?subject=Bathroom Quote" class="btn btn-gold d-none d-lg-block ms-3">GET A QUOTE</a>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="container-fluid py-4 py-lg-5">
        <div class="container text-center">
            <h1 class="animated slideInDown" style="font-size: 2rem;">Bathroom Collections</h1>
            <div class="section-line"></div>
            <p style="color: var(--primary-gold); letter-spacing: 3px; text-uppercase; font-size: 0.6rem; margin: 0;">Bespoke Vanities & Storage</p>
        </div>
    </div>

    <!-- Filter Cards Section -->
    <div class="container-xxl py-2">
        <div class="container">
            <div class="row g-2 justify-content-center">
                <div class="col-4 col-lg-2">
                    <div class="style-card active" onclick="applyFilter('all', this)">
                        <i class="fa fa-th-large"></i>
                        <h4>All</h4>
                    </div>
                </div>
                <div class="col-4 col-lg-2">
                    <div class="style-card" onclick="applyFilter('vanity', this)">
                        <i class="fa fa-sink"></i>
                        <h4>Vanities</h4>
                    </div>
                </div>
                <div class="col-4 col-lg-2">
                    <div class="style-card" onclick="applyFilter('modern', this)">
                        <i class="fa fa-bath"></i>
                        <h4>Modern</h4>
                    </div>
                </div>
                <div class="col-4 col-lg-2">
                    <div class="style-card" onclick="applyFilter('linen', this)">
                        <i class="fa fa-door-closed"></i>
                        <h4>Linen</h4>
                    </div>
                </div>
                <div class="col-4 col-lg-2">
                    <div class="style-card" onclick="applyFilter('mirror', this)">
                        <i class="fa fa-square"></i>
                        <h4>Mirrored</h4>
                    </div>
                </div>
                <div class="col-4 col-lg-2">
                    <div class="style-card" onclick="applyFilter('float', this)">
                        <i class="fa fa-level-up-alt"></i>
                        <h4>Floating</h4>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="container-xxl py-5">
        <div class="container text-center">
            <div class="gallery-grid" id="gallery">
                <!-- Automated Loader -->
            </div>
        </div>
    </div>

    <!-- LUXURY FOOTER -->
    <footer class="footer wow fadeIn" data-wow-delay="0.1s">
        <div class="container text-center">
            <div class="mx-auto mb-5">
                <h1 class="display-6 text-white" style="font-size: 1.5rem;">Start Your Bathroom Project</h1>
                <div style="width: 40px; height: 1px; background: var(--primary-gold); margin: 20px auto;"></div>
            </div>
            
            <div class="row g-4 justify-content-center">
                <div class="col-lg-4">
                    <i class="fa fa-phone-alt accent mb-2 d-block"></i>
                    <a href="tel:+61412270000" class="contact-link-tel">+61 412 270 000</a>
                </div>
                <div class="col-lg-4">
                    <i class="fa fa-envelope accent mb-2 d-block"></i>
                    <a href="mailto:Info@AUCabinet.au" class="contact-link-email">Info@AUCabinet.au</a>
                </div>
            </div>
        </div>
        
        <div class="container border-top border-secondary mt-5 pt-4 text-center">
            <p class="m-0 small text-muted text-uppercase" style="letter-spacing: 1px; font-size: 0.65rem;">
                &copy; 2024 AU Cabinet. All Rights Reserved. <span class="ms-3">ABN 99 894 945 721</span>
            </p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>

    <script>
        let allPhotos = []; 

        async function initGallery() {
            try {
                // FETCHING FROM YOUR BATH FOLDER
                const response = await fetch('https://api.github.com/repos/ibehrouz/ibehrouz.github.io/contents/photos/bath');
                allPhotos = await response.json();
                renderGallery('all');
            } catch (e) { console.error("Gallery failed to load", e); }
        }

        function renderGallery(filter) {
            const galleryDiv = document.getElementById('gallery');
            galleryDiv.innerHTML = '';
            
            allPhotos.forEach(file => {
                const fileName = file.name.toLowerCase();
                if (filter === 'all' || fileName.includes(filter)) {
                    if (file.type === 'file' && fileName.match(/\.(jpg|jpeg|png|gif)$/i)) {
                        const a = document.createElement('a');
                        a.href = file.download_url;
                        a.setAttribute('data-lightbox', filter); 
                        const img = document.createElement('img');
                        img.src = file.download_url;
                        img.loading = "lazy";
                        a.appendChild(img);
                        galleryDiv.appendChild(a);
                    }
                }
            });
        }

        function applyFilter(category, element) {
            document.querySelectorAll('.style-card').forEach(card => card.classList.remove('active'));
            element.classList.add('active');
            renderGallery(category);
        }

        initGallery();
        new WOW().init();
    </script>
</body>
</html>
