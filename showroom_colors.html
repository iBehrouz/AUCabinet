<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MATERIALS | Showroom</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link rel="icon" href="favicon2.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@200;300;400;600&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <style>
        :root { --gold: #c5a059; --dark: #0a0a0a; }
        body { background-color: var(--dark); color: #f4f4f4; font-family: 'Montserrat', sans-serif; }
        h1 { font-family: 'Playfair Display', serif; color: #fff; }
        .navbar-showroom { background: #000 !important; border-bottom: 1px solid #111; padding: 10px 0; }
        .nav-link { text-transform: uppercase; letter-spacing: 2px; font-size: 10px; color: #777 !important; }
        .nav-link:hover, .nav-link.active { color: var(--gold) !important; }
        
        /* Smaller Grid for Colors */
        .color-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
        .color-box { background: #111; border: 1px solid #1a1a1a; position: relative; aspect-ratio: 1/1; overflow: hidden; }
        .color-box img { width: 100%; height: 100%; object-fit: cover; opacity: 0.8; }
        .color-label { position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 5px; text-align: center; text-transform: uppercase; }
        
        .footer-showroom { background: #000 !important; border-top: 1px solid #111; padding: 60px 0; }
        .divider { width: 30px; height: 1px; background: var(--gold); margin: 15px auto; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-showroom sticky-top">
        <div class="container-fluid px-4">
            <a href="gallery.html" class="navbar-brand"><img src="img/showroomlogo.png" style="height: 35px;"></a>
            <div class="navbar-nav ms-auto d-none d-lg-flex">
                <a href="showroom_kitchen.html" class="nav-link">Kitchen</a>
                <a href="showroom_pantry.html" class="nav-link">Pantry</a>
                <a href="showroom_colors.html" class="nav-link active">Materials</a>
            </div>
        </div>
    </nav>

    <div class="container text-center py-5">
        <h1 class="display-6">MATERIAL PALETTE</h1>
        <div class="divider"></div>
        <p class="small text-uppercase text-muted">Texture & Tone Selection</p>
    </div>

    <div class="container pb-5">
        <div class="color-grid" id="gallery"></div>
    </div>

    <footer class="footer-showroom text-center">
        <p style="font-size: 10px; color: #444; letter-spacing: 4px; text-transform: uppercase;">
            PROJECT GALLERY &copy; <span id="year"></span>
        </p>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        async function init() {
            const res = await fetch('https://api.github.com/repos/ibehrouz/ibehrouz.github.io/contents/photos/colors');
            const data = await res.json();
            const div = document.getElementById('gallery');
            data.forEach(p => {
                if (p.name.match(/\.(jpg|jpeg|png)$/i)) {
                    const name = p.name.replace(/\.[^/.]+$/, "").replace(/[-_]/g, ' ');
                    div.innerHTML += `<div class="color-box"><img src="${p.download_url}"><div class="color-label">${name}</div></div>`;
                }
            });
        }
        init();
    </script>
</body>
</html>
